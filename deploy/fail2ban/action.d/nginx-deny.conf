# Ban by adding a deny rule to nginx rather than to the firewall.
#
# Why not the usual iptables action: this origin sits behind the Cloudflare
# proxy, so every packet arrives from a Cloudflare address. The real client
# address exists only in the CF-Connecting-IP header. A firewall ban on the
# client address therefore blocks nothing at all, while appearing to work —
# and a firewall ban on the *source* address would block Cloudflare, taking
# the whole site off the air.
#
# nginx, however, has already substituted the real address into $remote_addr
# via the real_ip module, so a deny rule there matches the actual client.
#
# The blocklist lives in conf.d, which nginx includes at http level, so the
# deny applies to every server block.

[Definition]

actionstart = touch <blocklist>
              chmod 0644 <blocklist>

actionstop  = printf '' > <blocklist>
              nginx -t && systemctl reload nginx

actioncheck =

# Append, then reload. A reload is graceful: existing connections finish on
# the old workers, so this does not interrupt anyone mid-request.
actionban   = printf 'deny %%s;\n' "<ip>" >> <blocklist>
              nginx -t && systemctl reload nginx

actionunban = sed -i "\\#^deny <ip>;\$#d" <blocklist>
              nginx -t && systemctl reload nginx

[Init]

blocklist = /etc/nginx/conf.d/fail2ban-deny.conf
