# Detect failed application logins in the nginx access log.
#
# The application distinguishes them for us without needing a separate log: a
# successful login redirects (302 to the dashboard or ?next=), while a failed
# one re-renders the form (200). So a POST to the login URL answered with 200
# is a rejected credential.
#
# Deliberately matched on the access log rather than adding application-level
# logging: the access log already records every attempt with the client
# address, and a second source of truth would be one more thing to keep in
# step.
#
# This depends on the real-IP configuration (deploy/cloudflare-realip.sh).
# Without it the first field is Cloudflare's address, and this filter would
# count every visitor's failures against a single shared address and ban
# Cloudflare itself.

[Definition]

failregex = ^<HOST> - \S+ \[\] "POST /accounts/login/[^"]*" 200

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
