# Jails for this deployment.
#
# Two different problems needing two different actions:
#
#   sshd  — connections arrive directly, so the packet source is the real
#           client and a firewall ban works normally.
#
#   login — connections arrive via the Cloudflare proxy, so the packet source
#           is Cloudflare. A firewall ban would either block nothing (banning
#           the client address, which never appears in a packet) or block
#           everything (banning the source, which is Cloudflare). The ban has
#           to happen in nginx, which knows the real address. See
#           action.d/nginx-deny.conf.

[DEFAULT]
# Never lock out the admin LAN or the box itself. Losing SSH to your own
# fail2ban is the classic way to need physical access to a machine.
ignoreip = 127.0.0.1/8 ::1 10.10.30.0/24 192.168.25.0/24

[sshd]
enabled  = true
backend  = systemd
maxretry = 5
findtime = 10m
bantime  = 1h

[jmltracker-login]
enabled  = true
filter   = jmltracker-login
logpath  = /var/log/nginx/access.log
banaction = nginx-deny
# Deliberately generous. The demo credentials are published in the README, so
# visitors legitimately fumble them; this is aimed at automated credential
# stuffing, not at someone mistyping twice.
maxretry = 10
findtime = 10m
bantime  = 1h
