# Nginx reverse proxy for the JML tracker.
#
# Install to /etc/nginx/sites-available/jmltracker and symlink into
# sites-enabled, substituting the hostname:
#
#   sudo sed 's/__HOSTNAME__/your.host.example/' deploy/nginx.conf \
#       | sudo tee /etc/nginx/sites-available/jmltracker >/dev/null
#   sudo nginx -t
#
# __HOSTNAME__ appears in exactly one directive, the server_name below (the
# other occurrence is the example line above, and rewriting a comment is
# harmless). It is deliberately not a word that occurs elsewhere in this file:
# a substitution aimed at, say, "jmltracker" would also rewrite the upstream
# name, the socket path and the proxy_pass target, producing a file that looks
# plausible and fails to parse. No hostname is committed to this repo.
#
# This file is deliberately HTTP-only. `certbot --nginx` rewrites it in place
# when a certificate is issued: it adds the listen 443 server block, the
# certificate paths, and the port-80 redirect. Writing those by hand first
# means certbot has to reconcile with config that references certificate files
# which do not exist yet, and nginx will not start in that state.
#
# Static files are served by WhiteNoise inside the application, not by an
# alias here. That keeps one codebase working unchanged on a host with no
# nginx in front of it, and avoids granting the nginx user read access into
# the application directory.

upstream jmltracker_app {
    server unix:/run/jmltracker/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name __HOSTNAME__;

    client_max_body_size 4M;

    # HSTS is deliberately NOT set here — Django owns it via
    # SECURE_HSTS_SECONDS so the same policy applies on hosts with no nginx.
    # Setting it in both places would emit the header twice.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Drives SECURE_PROXY_SSL_HEADER so request.is_secure() is accurate
        # once TLS is terminated in front of the application.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://jmltracker_app;
    }
}
