# Nginx reverse proxy for the JML tracker.
# Install to /etc/nginx/sites-available/jmltracker and symlink into
# sites-enabled. Replace REPLACE_WITH_HOSTNAME before use — no hostname is
# committed to this repo.
#
# TLS is issued by certbot, which rewrites this file in place on first run.

upstream jmltracker_app {
    server unix:/run/jmltracker/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name REPLACE_WITH_HOSTNAME;

    # Certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name REPLACE_WITH_HOSTNAME;

    # Paths written by certbot.
    ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_HOSTNAME/privkey.pem;

    client_max_body_size 4M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # HSTS is deliberately NOT set here — Django owns it via SECURE_HSTS_SECONDS
    # so the same policy applies on hosts with no Nginx. Setting it in both
    # places would emit the header twice.

    # WhiteNoise can serve these, but Nginx does it without waking a worker.
    location /static/ {
        alias /opt/jmltracker/jmltracker/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Drives SECURE_PROXY_SSL_HEADER so request.is_secure() is accurate.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://jmltracker_app;
    }
}
