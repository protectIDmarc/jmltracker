<svg xmlns="http://www.w3.org/2000/svg" width="720" height="704" viewBox="0 0 720 704" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 2L8 5L2 8Z" fill="#64748b"/></marker>
  </defs>

  <text x="24" y="26" font-size="16" font-weight="700" fill="#0f172a">Approver flow</text>
  <text x="24" y="44" font-size="12" fill="#64748b">Two guards run before a decision; every decision is stamped as audit evidence.</text>

  <!-- 1 Dashboard -->
  <g filter="url(#s)"><rect x="245" y="60" width="230" height="52" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/></g>
  <text x="360" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Dashboard</text>
  <text x="360" y="99" text-anchor="middle" font-size="11.5" fill="#64748b">approver role</text>
  <line x1="360" y1="112" x2="360" y2="136" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 2 Awaiting -->
  <g filter="url(#s)"><rect x="245" y="136" width="230" height="52" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/></g>
  <text x="360" y="158" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Awaiting my approval</text>
  <text x="360" y="175" text-anchor="middle" font-size="11.5" fill="#64748b">filtered to me</text>
  <line x1="360" y1="188" x2="360" y2="212" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 3 Open request -->
  <g filter="url(#s)"><rect x="245" y="212" width="230" height="52" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/></g>
  <text x="360" y="234" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Open request</text>
  <text x="360" y="251" text-anchor="middle" font-size="11.5" fill="#64748b">employee · systems</text>
  <line x1="360" y1="264" x2="360" y2="288" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 4 Guard requester -->
  <g filter="url(#s)"><rect x="245" y="288" width="230" height="52" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.4"/></g>
  <text x="360" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Am I the requester?</text>
  <text x="360" y="327" text-anchor="middle" font-size="11.5" fill="#a16207">self-approval check</text>
  <line x1="475" y1="314" x2="490" y2="314" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="481" y="306" font-size="11" font-weight="600" fill="#475569">yes</text>

  <!-- blocked 1 -->
  <g filter="url(#s)"><rect x="490" y="288" width="200" height="52" rx="10" fill="#fee2e2" stroke="#f87171" stroke-width="1.4"/></g>
  <text x="590" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Blocked</text>
  <text x="590" y="327" text-anchor="middle" font-size="11.5" fill="#b91c1c">no self-approval</text>

  <line x1="360" y1="340" x2="360" y2="368" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="372" y="357" font-size="11" font-weight="600" fill="#475569">no</text>

  <!-- 5 Guard decided -->
  <g filter="url(#s)"><rect x="245" y="368" width="230" height="52" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.4"/></g>
  <text x="360" y="390" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Already decided?</text>
  <text x="360" y="407" text-anchor="middle" font-size="11.5" fill="#a16207">double-approval check</text>
  <line x1="475" y1="394" x2="490" y2="394" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="481" y="386" font-size="11" font-weight="600" fill="#475569">yes</text>

  <!-- blocked 2 -->
  <g filter="url(#s)"><rect x="490" y="368" width="200" height="52" rx="10" fill="#fee2e2" stroke="#f87171" stroke-width="1.4"/></g>
  <text x="590" y="390" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Blocked</text>
  <text x="590" y="407" text-anchor="middle" font-size="11.5" fill="#b91c1c">no double-approval</text>

  <line x1="360" y1="420" x2="360" y2="448" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="372" y="437" font-size="11" font-weight="600" fill="#475569">no</text>

  <!-- 6 Decide -->
  <g filter="url(#s)"><rect x="245" y="448" width="230" height="52" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.4"/></g>
  <text x="360" y="470" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Decide</text>
  <text x="360" y="487" text-anchor="middle" font-size="11.5" fill="#64748b">approve or reject</text>

  <!-- split -->
  <line x1="360" y1="500" x2="360" y2="514" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="230" y1="514" x2="500" y2="514" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="230" y1="514" x2="230" y2="528" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="500" y1="514" x2="500" y2="528" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="188" y="510" font-size="11" font-weight="600" fill="#475569">approve</text>
  <text x="512" y="510" font-size="11" font-weight="600" fill="#475569">reject</text>

  <!-- Approved -->
  <g filter="url(#s)"><rect x="110" y="528" width="240" height="52" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="1.4"/></g>
  <text x="230" y="550" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">Approved</text>
  <text x="230" y="567" text-anchor="middle" font-size="11.5" fill="#15803d">stamped: who + when</text>

  <!-- Rejected -->
  <g filter="url(#s)"><rect x="380" y="528" width="240" height="52" rx="10" fill="#fce7f3" stroke="#f472b6" stroke-width="1.4"/></g>
  <text x="500" y="550" text-anchor="middle" font-size="14" font-weight="600" fill="#9d174d">Rejected</text>
  <text x="500" y="567" text-anchor="middle" font-size="11.5" fill="#be185d">stamped · end</text>

  <line x1="230" y1="580" x2="230" y2="608" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Mark completed -->
  <g filter="url(#s)"><rect x="110" y="608" width="240" height="52" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="1.4"/></g>
  <text x="230" y="630" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">Mark completed</text>
  <text x="230" y="647" text-anchor="middle" font-size="11.5" fill="#15803d">approver / admin · after IT provisions</text>
</svg>
