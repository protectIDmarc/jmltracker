{% extends "tracker/wizard/_wizard_base.html" %}

{% block wizard_content %}
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "tracker/_form_fields.html" with form=form %}
    <div class="form-actions">
      <button type="submit" class="primary">Continue</button>
      {# Back is a plain link: the previous step repopulates from the session. #}
      <a class="button" href="{% url 'wizard_employee' %}">Back</a>
    </div>
  </form>
{% endblock %}
